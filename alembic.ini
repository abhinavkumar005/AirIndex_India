# Alembic configuration for AirIndex India
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts (relative to this file)
script_location = database/migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Timezone for migration revision timestamps
# timezone =

# Max length of characters for the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py
# sourceless = false

# Version number format (default: %%(rev)s)
# version_path_separator = os  # Use os.pathsep
# output_encoding = utf-8

# Database URL — overridden by env.py from DATABASE_URL environment variable
sqlalchemy.url = postgresql+psycopg://airindex:change-me@localhost:5432/airindex


[post_write_hooks]
# Uncomment to run black on generated migration files:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
